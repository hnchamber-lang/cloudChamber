# =============================================================================
#  Chamber Instruments Catalog
#  -----------------------------------------------------------------------------
#  Single source of truth for all observation instruments in D:\Chamber.
#  Used by:
#    - reorganize.py       : folder renames / merges
#    - build_project.py    : namelist -> project folder builder
#    - chamber_gui.py      : dropdown population
#
#  Field reference
#  ---------------
#  code           : Unique key == final folder name under 01_instruments/
#  model          : Human-readable model (for GUI display)
#  serial         : Serial number (empty string "" if not yet identified)
#  category       : Instrument type (CCN, CPC, SMPS, OPC, etc.)
#  legacy_paths   : Old relative paths under D:\Chamber to be migrated here
#  file_patterns  : Glob patterns for data files (for date filtering)
#  date_source    : filename | folder | file_mtime | header
#  date_regex     : Regex capturing the date from filename/folder (optional)
#  date_format    : strftime format for parsing the captured date
#  note           : Free-text remarks
# =============================================================================

version: 1
generated: "2026-04-24"
root: "D:/Chamber"
instruments_root: "01_instruments"

instruments:

  # ---------- CCN (Cloud Condensation Nuclei counter) ----------
  - code: CCN200_SN2310-057
    model: "DMT CCN-200"
    serial: "2310-057"
    category: "CCN counter"
    legacy_paths: ["CCN_200 (NEW)"]
    file_patterns: ["CCN_200_Data_*.csv", "CCN-200 data *.csv"]
    date_source: "filename"
    date_regex: "CCN_200_Data_(\\d{8}_\\d{6})"
    date_format: "%Y%m%d_%H%M%S"
    note: "Corresponds to 'CCN_057' in project folders. Filenames look like CCN_200_Data_20240926_152030.csv"

  - code: CCN200_SN
    model: "DMT CCN-200"
    serial: ""
    category: "CCN counter"
    legacy_paths: ["CCN_200 (OLD)"]
