    date_source: "filename"
    date_regex: "CCN-200 data (\\d{12})\\.[cC][sS][vV]"
    date_format: "%y%m%d%H%M%S"
    note: "2022 archive. Older firmware - no SN in header. Fill serial after hardware-label check."

